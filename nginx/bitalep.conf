# BiTalep — new server_name only. Do not edit vetapp/mobilyahub/zerafet files.
# After HTTP is live: certbot --nginx -d api.bitalep.com.tr -d panel.bitalep.com.tr -d bitalep.com.tr -d www.bitalep.com.tr

server {
    listen 80;
    listen [::]:80;
    server_name api.bitalep.com.tr;
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.bitalep.com.tr;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bitalep.com.tr www.bitalep.com.tr;
    return 302 https://panel.bitalep.com.tr$request_uri;
}
