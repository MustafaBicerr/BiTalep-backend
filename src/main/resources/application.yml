server:
  port: 8080
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: bitalep-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bitalep}
    username: ${SPRING_DATASOURCE_USERNAME:bitalep}
    password: ${SPRING_DATASOURCE_PASSWORD:bitalep}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_BYTES:10485760}
      max-request-size: ${FILE_MAX_BYTES:10485760}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html

bitalep:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-to-a-64-char-random-string-hs256!!}
    access-minutes: 15
  refresh:
    days: 14
  billing:
    enforcement: ${BILLING_ENFORCEMENT:false}
  files:
    max-bytes: ${FILE_MAX_BYTES:10485760}
    storage-path: ${FILE_STORAGE_PATH:./data/files}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8081}
  panel-base-url: ${PANEL_BASE_URL:http://localhost:5173}
  demo-seed-key: ${DEMO_SEED_KEY:}
  mail:
    from: ${MAIL_FROM:BiTalep <noreply@bitalep.com.tr>}
  rate-limit:
    auth-per-minute: ${AUTH_RATE_LIMIT:60}
